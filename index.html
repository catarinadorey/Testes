<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Casino Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;900&display=swap');

        :root {
            --gold-gradient: linear-gradient(180deg, #ffefba 0%, #d4af37 50%, #8a6d3b 100%);
            --btn-gradient: linear-gradient(180deg, #f9d976 0%, #f39c12 100%);
        }

        body {
            background: #000;
            /* Background impactante com efeito de partículas/luz */
            background-image: 
                radial-gradient(circle at center, rgba(184, 134, 11, 0.2) 0%, transparent 70%),
                url('https://www.transparenttextures.com/patterns/stardust.png'); 
            color: white;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Título com brilho */
        h1 {
            font-family: 'Oswald', sans-serif;
            text-align: center;
            text-transform: uppercase;
            font-size: 2.2rem;
            margin: 0 0 20px 0;
            line-height: 1.1;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
        }

        /* Estrutura da Roleta (Mais próxima da imagem) */
        .outer-rim {
            position: relative;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            padding: 15px;
            background: #1a1a1a;
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 20px rgba(212, 175, 55, 0.4);
            border: 4px solid #333;
        }

        /* Luzes ao redor */
        .lights-frame {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            pointer-events: none;
            z-index: 5;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #fff;
            filter: drop-shadow(0 0 5px gold);
            z-index: 30;
        }

        /* Centro da Roleta (Bónus 100€) */
        .center-hub {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #f9d976, #b8860b);
            border-radius: 50%;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px white;
            border: 3px solid #000;
        }

        .center-hub span {
            color: #000;
            font-weight: 900;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .center-hub strong {
            color: #000;
            font-size: 1.2rem;
        }

        /* Cronómetro Digital */
        .timer-box {
            margin-top: 25px;
            text-align: center;
        }

        .timer-label {
            font-size: 0.8rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        #countdown {
            background: rgba(0,0,0,0.8);
            border: 2px solid #333;
            padding: 10px 30px;
            border-radius: 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            letter-spacing: 5px;
        }

        /* Botão "Resgatar" igual à imagem */
        .btn-main {
            margin-top: 25px;
            width: 350px;
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: var(--btn-gradient);
            color: #000;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 0 #8a6d3b, 0 10px 20px rgba(0,0,0,0.5);
            transition: 0.1s;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8a6d3b;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #111;
            border: 3px solid #d4af37;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 50px gold;
        }

        .claim-link {
            display: block;
            background: var(--gold-gradient);
            color: #000;
            padding: 15px;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Roda a roleta e ganha<br>uma oferta exclusiva!</h1>

    <div class="outer-rim">
        <div class="lights-frame"></div>
        <div class="arrow"></div>
        <div class="center-hub">
            <span>Bónus</span>
            <strong>€100</strong>
        </div>
        <div class="wheel-container">
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="timer-box">
        <div class="timer-label">Oferta termina em:</div>
        <div id="countdown">03:12:45</div>
    </div>

    <button class="btn-main" onclick="spin()">Resgatar Oferta</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="winner-name" style="color:#d4af37">PARABÉNS!</h2>
            <p id="winner-offer" style="font-size: 1.2rem;"></p>
            <a id="winner-link" href="#" target="_blank" class="claim-link">REIVINDICAR AGORA</a>
        </div>
    </div>

    <script>
        const brands = [
            { name: "CAESARS", color: "#16302b", offer: "Deposit 10$ earn 200$", url: "https://offers.pickswise.com/tyyw" },
            { name: "BETMGM", color: "#000000", offer: "Deposit Match up to 1000$", url: "https://mediaserver.betmgmpartners.com/renderBanner.do?zoneId=1742008" },
            { name: "BET365", color: "#127e5d", offer: "Deposit Match up to 900$", url: "https://www.bet365.com/hub/en-us/open-account-offer-gaming?affiliate=365_03333889" },
            { name: "WSOP", color: "#7b1113", offer: "Deposit Match up to 800$", url: "https://wlcaesarsinteractive.adsrv.eacdn.com/C.ashx?btag=a_987658961b_2058c_&affid=2536&siteid=987658961&adid=2058&c=" },
            { name: "FANDUEL", color: "#1475e1", offer: "Deposit Match up to 2000$", url: "https://wlfanduelus.adsrv.eacdn.com/C.ashx?btag=a_21532b_50c_&affid=11877&siteid=21532&adid=50&c=" },
            { name: "PLAYSTAR", color: "#2d1b4d", offer: "Deposit Match up to 500$", url: "https://click.trackplaystar.com/track/62436506-a2d2-4275-8d69-441854d193ca?type=seo&s1=freebets" },
            { name: "HARD ROCK", color: "#1a1a1a", offer: "Deposit Match up to 600$", url: "https://wlhardrock.adsrv.eacdn.com/C.ashx?btag=a_1832b_258c_&affid=201&siteid=1832&adid=258&c=" },
            { name: "FANATICS", color: "#c8102e", offer: "Deposit Match up to 700$", url: "https://track.fanaticsbettingpartners.com/track/6c270394-cbf7-4c98-a6f2-10334c1afd85?type=native&s1=BonusBets" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (brands.length / 2);
        let startAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, 400, 400);
            brands.forEach((brand, i) => {
                const angle = startAngle + i * arc;
                ctx.fillStyle = brand.color;
                ctx.beginPath();
                ctx.arc(200, 200, 200, angle, angle + arc, false);
                ctx.lineTo(200, 200);
                ctx.fill();
                
                // Divisórias douradas
                ctx.strokeStyle = "#d4af37";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(200 + Math.cos(angle + arc/2) * 140, 200 + Math.sin(angle + arc/2) * 140);
                ctx.rotate(angle + arc/2 + Math.PI/2);
                ctx.fillStyle = "#fff";
                ctx.font = "900 14px Roboto";
                ctx.fillText(brand.name, -ctx.measureText(brand.name).width / 2, 0);
                ctx.restore();
            });
        }

        // Lógica do Cronómetro (Reinicia em 03:12:45)
        function startTimer() {
            const initialTime = (3 * 3600) + (12 * 60) + 45;
            let timer = initialTime;
            const display = document.querySelector('#countdown');

            setInterval(() => {
                let h = Math.floor(timer / 3600);
                let m = Math.floor((timer % 3600) / 60);
                let s = timer % 60;

                display.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

                if (--timer < 0) timer = initialTime;
            }, 1000);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            const duration = 5000;
            const startTime = performance.now();
            const totalRotation = (10 + Math.random() * 5) * 360;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);
                
                startAngle = (easeOut * totalRotation) * Math.PI / 180;
                drawWheel();

                if (progress < 1) requestAnimationFrame(animate);
                else {
                    isSpinning = false;
                    const degrees = (startAngle * 180 / Math.PI) % 360;
                    const index = Math.floor((360 - (degrees + 270) % 360) / (360 / brands.length));
                    const winner = brands[index < 0 ? index + brands.length : index];
                    
                    setTimeout(() => {
                        document.getElementById("winner-name").innerText = winner.name;
                        document.getElementById("winner-offer").innerText = winner.offer;
                        document.getElementById("winner-link").href = winner.url;
                        document.getElementById("modal").style.display = "flex";
                    }, 500);
                }
            }
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            drawWheel();
            startTimer();
        };
    </script>
</body>
</html>
