<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin & Win Casino Offers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: hsl(220, 20%, 8%);
      --foreground: hsl(45, 100%, 95%);
      --primary: hsl(45, 100%, 50%);
      --secondary: hsl(220, 15%, 18%);
      --muted: hsl(220, 10%, 60%);
      --gold-gradient: linear-gradient(135deg, hsl(45, 100%, 50%) 0%, hsl(30, 100%, 45%) 50%, hsl(45, 100%, 55%) 100%);
      --dark-gradient: linear-gradient(180deg, hsl(220, 20%, 12%) 0%, hsl(220, 20%, 6%) 100%);
      --glass-bg: hsla(220, 15%, 15%, 0.8);
      --glow-gold: 0 0 30px hsla(45, 100%, 50%, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark-gradient);
      color: var(--foreground);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* --- EFEITO SPARKLING INTENSO --- */
    #sparkles-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .sparkle {
      position: absolute;
      background: radial-gradient(circle, #fff 10%, rgba(255,215,0,0.9) 40%, rgba(255,215,0,0) 80%);
      border-radius: 50%;
      opacity: 0;
      animation: sparkle-anim linear forwards;
      filter: blur(1px);
    }

    /* Brilho tipo "Estrela" para algumas partículas */
    .flare::before, .flare::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 200%; height: 1px;
      background: rgba(255,215,0,0.8);
      transform: translate(-50%, -50%);
    }
    .flare::after { transform: translate(-50%, -50%) rotate(90deg); }

    @keyframes sparkle-anim {
      0% { transform: scale(0) translateY(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scale(1.2) translateY(-40px); opacity: 0; }
    }
    /* -------------------------------- */

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .gold-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .timer-container { margin-bottom: 20px; }
    .timer-label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .timer { display: flex; justify-content: center; gap: 8px; align-items: center; }
    .timer-digit {
      background: linear-gradient(180deg, hsl(220, 15%, 18%) 0%, hsl(220, 15%, 12%) 100%);
      border: 1px solid hsla(45, 100%, 50%, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 50px;
    }
    .timer-digit span { font-size: 24px; font-weight: 700; }
    .timer-separator { font-size: 24px; font-weight: 700; }

    .title { font-size: 36px; font-weight: 900; margin-bottom: 10px; }
    .subtitle { font-size: 16px; color: var(--muted); margin-bottom: 30px; }

    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 30px;
    }

    @media (min-width: 768px) {
      .wheel-container { width: 400px; height: 400px; }
    }

    .pointer {
      position: absolute;
      top: -10px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 35px solid hsl(45, 100%, 50%);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
      z-index: 20;
    }

    .wheel-border {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, hsl(45, 100%, 60%) 0%, hsl(30, 100%, 45%) 50%, hsl(45, 100%, 55%) 100%);
      padding: 6px;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .wheel-border-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--background); }

    .wheel {
      position: absolute; inset: 6px;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .wheel svg { width: 100%; height: 100%; }

    .center-circle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 70px; height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, hsl(45, 100%, 55%) 0%, hsl(30, 100%, 40%) 100%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; color: var(--background);
      z-index: 10;
    }

    .spin-button {
      background: var(--gold-gradient);
      color: var(--background);
      font-weight: 700; font-size: 18px;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 16px 40px;
      border: none; border-radius: 50px;
      cursor: pointer; transition: all 0.3s ease;
      position: relative; z-index: 2;
    }

    .spin-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px hsla(45, 100%, 50%, 0.6);
    }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid hsla(45, 100%, 50%, 0.4);
      border-radius: 16px;
      max-width: 500px; width: 100%;
      padding: 30px; position: relative;
      animation: scaleIn 0.3s ease;
    }

    .brand-logo-container {
      width: 220px; height: 110px;
      background: #fff; border-radius: 12px;
      padding: 12px; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-logo-container img { width: 100%; height: 100%; object-fit: contain; }

    .cta-button {
      display: block; width: 100%;
      background: var(--gold-gradient);
      color: var(--background);
      font-weight: 700; text-transform: uppercase;
      padding: 16px; border-radius: 12px;
      text-decoration: none; text-align: center;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px hsla(45, 100%, 50%, 0.4); }
      50% { box-shadow: 0 0 40px hsla(45, 100%, 50%, 0.7); }
    }
  </style>
</head>
<body>
  <div id="sparkles-container"></div>

  <div class="container">
    <div class="timer-container">
      <p class="timer-label">✨ Offer expires in ✨</p>
      <div class="timer">
        <div class="timer-digit"><span class="gold-text" id="hours">02</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="minutes">12</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="seconds">45</span></div>
      </div>
    </div>

    <h1 class="title gold-text">🏆 SPIN & WIN! 🏆</h1>
    <p class="subtitle">Discover your exclusive offer at the best sportsbooks!</p>

    <div class="wheel-container">
      <div class="pointer"></div>
      <div class="wheel-border">
        <div class="wheel-border-inner"></div>
      </div>
      <div class="wheel" id="wheel">
        <svg viewBox="0 0 100 100"></svg>
      </div>
      <div class="center-circle">SPIN</div>
    </div>

    <button class="spin-button" id="spinBtn">SEE OFFER</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div style="text-align: center;">
        <span class="winner-badge gold-text">🎉 CONGRATULATIONS! 🎉</span>
        <div class="brand-logo-container">
          <img id="modalLogo" src="" alt="Brand Logo">
        </div>
        <h2 class="brand-name gold-text" id="modalName"></h2>
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
          <p id="modalOffer" style="font-size: 22px; font-weight: 700;"></p>
        </div>
        <a class="cta-button" id="modalCta" href="#" target="_blank">GET OFFER →</a>
        <button onclick="closeModal()" style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer;">Close</button>
      </div>
    </div>
  </div>

  <script>
    // --- LÓGICA DO SPARKLING INTENSO ---
    const sparkleContainer = document.getElementById('sparkles-container');
    
    function createSparkle() {
      const sparkle = document.createElement('div');
      const isFlare = Math.random() > 0.8; // 20% das luzes serão "Flare"
      
      sparkle.className = isFlare ? 'sparkle flare' : 'sparkle';
      
      const size = Math.random() * 5 + 3 + 'px';
      sparkle.style.width = size;
      sparkle.style.height = size;
      
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.top = Math.random() * 100 + '%';
      
      const duration = Math.random() * 1.5 + 0.8;
      sparkle.style.animationDuration = duration + 's';
      
      sparkleContainer.appendChild(sparkle);
      
      setTimeout(() => sparkle.remove(), duration * 1000);
    }
    
    // Frequência aumentada para 10 brilhos por segundo
    setInterval(createSparkle, 100);
    // -------------------------------------

    const brands = [
      { id: "caesar", name: "Caesars", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Caesars-removebg-preview.png", offer: "Deposit $10 earn $200", color: "#F5F5F5" },
      { id: "betmgm", name: "BetMGM", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/BetMGM-removebg-preview.png", offer: "Deposit Match up to $1000", color: "#E5D1B1" },
      { id: "bet365", name: "Bet365", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/bet365-2-removebg-preview.png", offer: "Deposit Match up to $900", color: "#F5F5F5" },
      { id: "wsop", name: "WSOP", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/WSOP.png", offer: "Deposit Match up to $800", color: "#E5D1B1" },
      { id: "fanatics", name: "Fanatics", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Fanatics-removebg-preview.png", offer: "Deposit Match up to $700", color: "#F5F5F5" },
      { id: "hardrock", name: "Hard Rock Bet", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Hard-Rock-Bet.png", offer: "Deposit Match up to $600", color: "#E5D1B1" },
      { id: "playstar", name: "PlayStar", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/PlayStar.png", offer: "Deposit Match up to $500", color: "#F5F5F5" },
      { id: "fanduel", name: "FanDuel", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/FanDuel-scaled.png", offer: "Deposit Match up to $2000", color: "#E5D1B1" }
    ];

    const wheelSvg = document.querySelector('#wheel svg');
    const segmentAngle = 360 / brands.length;

    brands.forEach((brand, index) => {
      const startAngle = index * segmentAngle - 90;
      const endAngle = startAngle + segmentAngle;
      const startRad = (startAngle * Math.PI) / 180;
      const endRad = (endAngle * Math.PI) / 180;
      const x1 = 50 + 50 * Math.cos(startRad);
      const y1 = 50 + 50 * Math.sin(startRad);
      const x2 = 50 + 50 * Math.cos(endRad);
      const y2 = 50 + 50 * Math.sin(endRad);
      const largeArc = segmentAngle > 180 ? 1 : 0;
      
      const midAngle = ((startAngle + endAngle) / 2 * Math.PI) / 180;
      const logoX = 50 + 32 * Math.cos(midAngle);
      const logoY = 50 + 32 * Math.sin(midAngle);
      const logoRotation = (startAngle + endAngle) / 2 + 90;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = `
        <path d="M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${brand.color}" stroke="rgba(212,175,55,0.3)" stroke-width="0.3"/>
        <image href="${brand.logo}" x="${logoX - 10}" y="${logoY - 6}" width="20" height="12" transform="rotate(${logoRotation}, ${logoX}, ${logoY})" preserveAspectRatio="xMidYMid meet"/>
      `;
      wheelSvg.appendChild(g);
    });

    let currentRotation = 0;
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');

    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;
      const winnerIndex = Math.floor(Math.random() * brands.length);
      const extraVoltas = 360 * 8;
      const stopAngle = 360 - (winnerIndex * segmentAngle) - (segmentAngle / 2);
      currentRotation += extraVoltas + stopAngle + (360 - (currentRotation % 360));
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const brand = brands[winnerIndex];
        document.getElementById('modalLogo').src = brand.logo;
        document.getElementById('modalName').textContent = brand.name;
        document.getElementById('modalOffer').textContent = brand.offer;
        document.getElementById('modalOverlay').classList.add('active');
        spinBtn.disabled = false;
      }, 4000);
    });

    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

    // Timer simples
    let ts = 8000;
    setInterval(() => {
      ts--;
      document.getElementById('minutes').textContent = String(Math.floor(ts/60)).padStart(2,'0');
      document.getElementById('seconds').textContent = String(ts%60).padStart(2,'0');
    }, 1000);
  </script>
</body>
</html>
