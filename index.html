<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Gold Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Oswald:wght@500;700&display=swap');

        :root {
            --gold: #f3cf7a;
            --gold-bright: #ffefba;
            --dark-bg: #0a0a0a;
            --casino-red: #c8102e;
        }

        body {
            background: radial-gradient(circle at center, #1e1e1e 0%, #000 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Título Estilizado */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to bottom, #fff 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* Layout da Roleta */
        .wheel-wrapper {
            position: relative;
            padding: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, #222, #000);
            box-shadow: 0 0 100px rgba(243, 207, 122, 0.15);
        }

        .wheel-container {
            position: relative;
            width: 380px;
            height: 380px;
            border: 8px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Lâmpadas ao redor (Efeito visual) */
        .lights {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px var(--gold);
            pointer-events: none;
        }

        canvas {
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        /* Indicador */
        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--gold);
            z-index: 20;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        /* Cronómetro */
        .timer-container {
            margin-top: 30px;
            text-align: center;
        }

        .timer-label {
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        #countdown {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            background: #111;
            padding: 5px 20px;
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--gold-bright);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            letter-spacing: 4px;
        }

        /* Botão */
        .btn-resgatar {
            margin-top: 30px;
            background: linear-gradient(to bottom, #f3cf7a 0%, #b8860b 100%);
            color: #000;
            padding: 15px 60px;
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(184, 134, 11, 0.4);
            transition: 0.3s;
        }

        .btn-resgatar:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.6);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 0 50px rgba(243, 207, 122, 0.2);
        }

        .modal-content h2 { color: var(--gold); margin-top: 0; }
        .modal-content p { font-size: 1.3rem; margin: 20px 0; }

        .claim-btn {
            display: block;
            background: var(--gold);
            color: #000;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>Roda a Roleta e Ganha<br><small style="font-size: 0.5em; vertical-align: middle; opacity: 0.8;">Ofertas Exclusivas de Casino</small></h1>
    </header>

    <div class="wheel-wrapper">
        <div class="lights"></div>
        <div class="arrow"></div>
        <div class="wheel-container">
            <canvas id="wheel" width="380" height="380"></canvas>
        </div>
    </div>

    <div class="timer-container">
        <div class="timer-label">A oferta termina em:</div>
        <div id="countdown">03:12:45</div>
    </div>

    <button class="btn-resgatar" onclick="spin()">Resgatar Oferta</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="winner-name">PARABÉNS!</h2>
            <p id="winner-offer"></p>
            <a id="winner-link" href="#" target="_blank" class="claim-btn">Reivindicar Agora</a>
        </div>
    </div>

    <script>
        // Configuração das marcas
        const brands = [
            { name: "Caesars", color: "#16302b", offer: "Deposit 10$ earn 200$", url: "https://offers.pickswise.com/tyyw" },
            { name: "BetMGM", color: "#000000", offer: "Deposit Match up to 1000$", url: "https://mediaserver.betmgmpartners.com/renderBanner.do?zoneId=1742008" },
            { name: "Bet365", color: "#127e5d", offer: "Deposit Match up to 900$", url: "https://www.bet365.com/hub/en-us/open-account-offer-gaming?affiliate=365_03333889" },
            { name: "WSOP", color: "#7b1113", offer: "Deposit Match up to 800$", url: "https://wlcaesarsinteractive.adsrv.eacdn.com/C.ashx?btag=a_987658961b_2058c_&affid=2536&siteid=987658961&adid=2058&c=" },
            { name: "FanDuel", color: "#1475e1", offer: "Deposit Match up to 2000$", url: "https://wlfanduelus.adsrv.eacdn.com/C.ashx?btag=a_21532b_50c_&affid=11877&siteid=21532&adid=50&c=" },
            { name: "Playstar", color: "#2d1b4d", offer: "Deposit Match up to 500$", url: "https://click.trackplaystar.com/track/62436506-a2d2-4275-8d69-441854d193ca?type=seo&s1=freebets" },
            { name: "HardRock", color: "#1a1a1a", offer: "Deposit Match up to 600$", url: "https://wlhardrock.adsrv.eacdn.com/C.ashx?btag=a_1832b_258c_&affid=201&siteid=1832&adid=258&c=" },
            { name: "Fanatics", color: "#c8102e", offer: "Deposit Match up to 700$", url: "https://track.fanaticsbettingpartners.com/track/6c270394-cbf7-4c98-a6f2-10334c1afd85?type=native&s1=BonusBets" }
        ];

        // Lógica do Contador
        function startTimer(duration, display) {
            let timer = duration, hours, minutes, seconds;
            setInterval(function () {
                hours = parseInt(timer / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                display.textContent = 
                    (hours < 10 ? "0" + hours : hours) + ":" + 
                    (minutes < 10 ? "0" + minutes : minutes) + ":" + 
                    (seconds < 10 ? "0" + seconds : seconds);

                if (--timer < 0) {
                    timer = duration; // Reinicia o contador
                }
            }, 1000);
        }

        window.onload = function () {
            const timeInSeconds = (3 * 3600) + (12 * 60) + 45; // 03:12:45
            const display = document.querySelector('#countdown');
            startTimer(timeInSeconds, display);
            drawWheel();
        };

        // Lógica da Roleta
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (brands.length / 2);
        let startAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, 400, 400);
            brands.forEach((brand, i) => {
                const angle = startAngle + i * arc;
                
                // Fatia
                ctx.fillStyle = brand.color;
                ctx.beginPath();
                ctx.arc(190, 190, 180, angle, angle + arc, false);
                ctx.lineTo(190, 190);
                ctx.fill();
                
                // Borda da fatia
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.stroke();

                // Texto
                ctx.save();
                ctx.translate(190 + Math.cos(angle + arc/2) * 120, 190 + Math.sin(angle + arc/2) * 120);
                ctx.rotate(angle + arc/2 + Math.PI/2);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px Poppins";
                ctx.fillText(brand.name, -ctx.measureText(brand.name).width / 2, 0);
                ctx.restore();
            });
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            
            const extraRounds = 5 + Math.random() * 5;
            const totalRotation = extraRounds * 360;
            const duration = 4000;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out cubic
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const currentRotation = easeOut * totalRotation;
                
                startAngle = (currentRotation * Math.PI / 180);
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    const finalAngleDegrees = (startAngle * 180 / Math.PI) % 360;
                    const index = Math.floor((360 - (finalAngleDegrees + 270) % 360) / (360 / brands.length));
                    showModal(brands[index]);
                }
            }
            requestAnimationFrame(animate);
        }

        function showModal(winner) {
            document.getElementById("winner-name").innerText = `GANHOU: ${winner.name}`;
            document.getElementById("winner-offer").innerText = winner.offer;
            document.getElementById("winner-link").href = winner.url;
            document.getElementById("modal").style.display = "flex";
        }
    </script>
</body>
</html>
