<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin & Win Casino Offers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: hsl(220, 20%, 8%);
      --foreground: hsl(45, 100%, 95%);
      --primary: hsl(45, 100%, 50%);
      --secondary: hsl(220, 15%, 18%);
      --muted: hsl(220, 10%, 60%);
      --gold-gradient: linear-gradient(135deg, hsl(45, 100%, 50%) 0%, hsl(30, 100%, 45%) 50%, hsl(45, 100%, 55%) 100%);
      --dark-gradient: linear-gradient(180deg, hsl(220, 20%, 12%) 0%, hsl(220, 20%, 6%) 100%);
      --glass-bg: hsla(220, 15%, 15%, 0.8);
      --glow-gold: 0 0 30px hsla(45, 100%, 50%, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark-gradient);
      color: var(--foreground);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .gold-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Timer Styles */
    .timer-container { margin-bottom: 20px; }
    .timer-label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .timer { display: flex; justify-content: center; gap: 8px; align-items: center; }
    .timer-digit {
      background: linear-gradient(180deg, hsl(220, 15%, 18%) 0%, hsl(220, 15%, 12%) 100%);
      border: 1px solid hsla(45, 100%, 50%, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 50px;
    }
    .timer-digit span { font-size: 24px; font-weight: 700; }

    /* Wheel Styles */
    .title { font-size: 32px; font-weight: 900; margin-bottom: 10px; line-height: 1.2; }
    .subtitle { font-size: 15px; color: var(--muted); margin-bottom: 30px; }

    .wheel-container {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 0 auto 30px;
    }

    @media (min-width: 768px) {
      .wheel-container { width: 420px; height: 420px; }
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid #ffcc00;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
      z-index: 30;
    }

    .wheel-border {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd700, #b8860b, #ffd700);
      padding: 8px;
      box-shadow: 0 0 50px rgba(184, 134, 11, 0.3);
    }

    .wheel-border-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #000;
      position: relative;
    }

    .wheel {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
      background: #111;
    }

    .wheel svg { width: 100%; height: 100%; transform: rotate(-2deg); }

    .center-circle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80px; height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd700 0%, #8b6508 100%);
      box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: #000;
      z-index: 10; border: 4px solid #000;
    }

    .spin-button {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 800;
      font-size: 20px;
      padding: 18px 50px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }

    .spin-button:hover:not(:disabled) { transform: translateY(-3px) scale(1.05); box-shadow: var(--glow-gold); }
    .spin-button:disabled { opacity: 0.6; cursor: wait; }

    /* Modal Adjustments */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1a1d23; border: 2px solid #ffd700;
      border-radius: 20px; max-width: 450px; width: 100%;
      padding: 30px; position: relative; color: white;
    }
    .brand-logo-container {
      background: white; border-radius: 12px;
      height: 100px; display: flex; align-items: center; justify-content: center;
      margin: 15px 0; padding: 10px;
    }
    .brand-logo-container img { max-height: 100%; max-width: 100%; object-fit: contain; }
    
    .cta-button {
      display: block; width: 100%; background: #22c55e;
      color: white; font-weight: 700; padding: 18px;
      border-radius: 12px; text-decoration: none; margin-top: 20px;
    }

    .pros-cons { text-align: left; margin: 20px 0; font-size: 14px; }
    .pros-cons ul { list-style: none; padding: 0; }
    .pros-cons li { margin-bottom: 5px; display: flex; gap: 10px; }

    .footer { margin-top: 30px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="timer-container">
      <p class="timer-label">LOCKED OFFER EXPIRES IN</p>
      <div class="timer">
        <div class="timer-digit"><span class="gold-text" id="hours">02</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="minutes">12</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="seconds">45</span></div>
      </div>
    </div>

    <h1 class="title gold-text">SPIN THE WHEEL<br>WIN EXCLUSIVE BONUS</h1>
    <p class="subtitle">Try your luck to unlock the best sportsbook offer today!</p>

    <div class="wheel-container">
      <div class="pointer"></div>
      <div class="wheel-border">
        <div class="wheel-border-inner"></div>
      </div>
      <div class="wheel" id="wheel">
        <svg viewBox="0 0 100 100"></svg>
      </div>
      <div class="center-circle">SPIN</div>
    </div>

    <button class="spin-button" id="spinBtn">CLICK TO SPIN</button>
    <p class="footer">Must be 21+. Terms and conditions apply. Gamble Responsibly.</p>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="gold-text" style="font-size: 24px; text-align: center;">YOU UNLOCKED:</h2>
      <div class="brand-logo-container">
        <img id="modalLogo" src="" alt="Brand Logo">
      </div>
      <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center;">
        <p id="modalOffer" style="font-size: 20px; font-weight: 800; color: #ffd700;"></p>
      </div>
      
      <div class="pros-cons">
        <ul id="modalPros"></ul>
      </div>

      <a class="cta-button" id="modalCta" href="#" target="_blank" style="text-align: center;">CLAIM MY BONUS NOW</a>
      <p id="modalTerms" style="font-size: 10px; color: #888; margin-top: 15px; text-align: center;"></p>
    </div>
  </div>

  <script>
    const brands = [
      { id: "caesar", name: "Caesars", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Caesars.png", offer: "Deposit $10 earn $200", url: "https://offers.pickswise.com/tyyw", color: "#C4A73E", pros: ["✓ Best Loyalty Program", "✓ Instant Withdrawals"], terms: "21+. New users. T&Cs apply." },
      { id: "betmgm", name: "BetMGM", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Betmgm.png", offer: "Bonus Match up to $1000", url: "https://mediaserver.betmgmpartners.com/renderBanner.do?zoneId=1742008", color: "#222222", pros: ["✓ High Betting Limits", "✓ Great Live Betting"], terms: "21+. NJ, PA, MI only. T&Cs apply." },
      { id: "bet365", name: "Bet365", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/bet365.png", offer: "Bet $5 Get $150 in Bonus Bets", url: "https://www.bet365.com/hub/en-us/open-account-offer-gaming?affiliate=365_03333889", color: "#027B5B", pros: ["✓ Best App UI", "✓ Early Payout Feature"], terms: "21+. New customers. T&Cs apply." },
      { id: "wsop", name: "WSOP", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/WSOP.png", offer: "100% Match up to $800", url: "https://wlcaesarsinteractive.adsrv.eacdn.com/C.ashx?btag=a_987658961b_2058c_&affid=2536&siteid=987658961&adid=2058&c=", color: "#E31837", pros: ["✓ World-Class Poker", "✓ Daily Tournaments"], terms: "21+. Poker only. T&Cs apply." },
      { id: "fanatics", name: "Fanatics", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Fanatics.jpg", offer: "Get $700 in Bonus Bets", url: "https://track.fanaticsbettingpartners.com/track/6c270394-cbf7-4c98-a6f2-10334c1afd85?type=native&s1=BonusBets", color: "#004C97", pros: ["✓ Exclusive Merch Rewards", "✓ Fast Payouts"], terms: "21+. New users. T&Cs apply." },
      { id: "hardrock", name: "Hard Rock", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Hard-Rock-Bet.png", offer: "Deposit Match up to $600", url: "https://wlhardrock.adsrv.eacdn.com/C.ashx?btag=a_1832b_258c_&affid=201&siteid=1832&adid=258&c=", color: "#000000", pros: ["✓ Iconic Brand Rewards", "✓ Secure Platform"], terms: "21+. Select states. T&Cs apply." },
      { id: "playstar", name: "PlayStar", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/PlayStar.png", offer: "Up to $500 Welcome Bonus", url: "https://click.trackplaystar.com/track/62436506-a2d2-4275-8d69-441854d193ca?type=seo&s1=freebets", color: "#6B21A8", pros: ["✓ Great Slot Selection", "✓ High RTP Games"], terms: "21+. NJ Only. T&Cs apply." },
      { id: "fanduel", name: "FanDuel", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/FanDuel-scaled.png", offer: "$2000 No Sweat First Bet", url: "https://wlfanduelus.adsrv.eacdn.com/C.ashx?btag=a_21532b_50c_&affid=11877&siteid=21532&adid=50&c=", color: "#1493FF", pros: ["✓ #1 Rated Sportsbook App", "✓ Same Game Parlays"], terms: "21+. New users. T&Cs apply." }
    ];

    // Build Wheel with explicit segmentation
    const wheelSvg = document.querySelector('#wheel svg');
    const totalSegments = brands.length;
    const anglePerSegment = 360 / totalSegments;

    brands.forEach((brand, i) => {
      const startAngle = i * anglePerSegment;
      const endAngle = startAngle + anglePerSegment;
      
      const x1 = 50 + 50 * Math.cos((Math.PI * (startAngle - 90)) / 180);
      const y1 = 50 + 50 * Math.sin((Math.PI * (startAngle - 90)) / 180);
      const x2 = 50 + 50 * Math.cos((Math.PI * (endAngle - 90)) / 180);
      const y2 = 50 + 50 * Math.sin((Math.PI * (endAngle - 90)) / 180);

      const pathData = `M 50 50 L ${x1} ${y1} A 50 50 0 0 1 ${x2} ${y2} Z`;
      
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      
      // Path with brand color
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('fill', brand.color);
      path.setAttribute('stroke', '#444');
      path.setAttribute('stroke-width', '0.1');
      
      // Logo positioning
      const midAngle = startAngle + (anglePerSegment / 2);
      const logoDist = 35;
      const lx = 50 + logoDist * Math.cos((Math.PI * (midAngle - 90)) / 180);
      const ly = 50 + logoDist * Math.sin((Math.PI * (midAngle - 90)) / 180);
      
      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', brand.logo);
      img.setAttribute('x', lx - 8);
      img.setAttribute('y', ly - 5);
      img.setAttribute('width', '16');
      img.setAttribute('height', '10');
      img.setAttribute('transform', `rotate(${midAngle}, ${lx}, ${ly})`);
      // Aplicando um pequeno filtro para remover visualmente o "xadrez" se houver
      img.setAttribute('style', 'filter: drop-shadow(0 0 1px white);');

      g.appendChild(path);
      g.appendChild(img);
      wheelSvg.appendChild(g);
    });

    let rotation = 0;
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');

    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;
      const winnerIndex = Math.floor(Math.random() * totalSegments);
      
      // Calculo exato para o ponteiro (0 graus / topo)
      const targetRotation = 360 - (winnerIndex * anglePerSegment) - (anglePerSegment / 2);
      const totalSpin = 3600 + targetRotation; // 10 voltas + alvo
      
      rotation += totalSpin + (360 - (rotation % 360));
      wheel.style.transform = `rotate(${rotation}deg)`;

      setTimeout(() => {
        showModal(brands[winnerIndex]);
        spinBtn.disabled = false;
      }, 5000);
    });

    function showModal(brand) {
      document.getElementById('modalLogo').src = brand.logo;
      document.getElementById('modalOffer').textContent = brand.offer;
      document.getElementById('modalCta').href = brand.url;
      document.getElementById('modalTerms').textContent = brand.terms;
      document.getElementById('modalPros').innerHTML = brand.pros.map(p => `<li>${p}</li>`).join('');
      document.getElementById('modalOverlay').classList.add('active');
    }

    // Timer Logic
    let time = 8235;
    setInterval(() => {
      time--;
      const h = Math.floor(time / 3600);
      const m = Math.floor((time % 3600) / 60);
      const s = time % 60;
      document.getElementById('hours').innerText = h.toString().padStart(2, '0');
      document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
      document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
    }, 1000);
  </script>
</body>
</html>
