<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roda a Roleta - Oferta Exclusiva</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #0f0f0f;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        h1 { color: var(--gold); text-align: center; text-transform: uppercase; }

        /* Container da Roleta */
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 20px 0;
        }

        canvas {
            border-radius: 50%;
            border: 10px solid var(--gold);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
        }

        /* Indicador (Seta) */
        .arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid var(--gold);
            z-index: 10;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ffd700, #b8860b);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Modal / Pop-up */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #222;
            padding: 40px;
            border: 2px solid var(--gold);
            text-align: center;
            border-radius: 15px;
            max-width: 400px;
        }

        .modal-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--gold);
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Roda a roleta e ganha<br><small>uma oferta exclusiva!</small></h1>

    <div class="wheel-container">
        <div class="arrow"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <button class="spin-btn" onclick="spin()">Resgatar Oferta</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="winner-name">Parabéns!</h2>
            <p id="winner-offer"></p>
            <a id="winner-link" href="#" target="_blank" class="modal-btn">REIVINDICAR AGORA</a>
        </div>
    </div>

    <script>
        const brands = [
            { name: "Caesars", color: "#1a3d33", offer: "Deposit 10$ earn 200$", url: "https://offers.pickswise.com/tyyw" },
            { name: "BetMGM", color: "#000000", offer: "Deposit Match up to 1000$", url: "https://mediaserver.betmgmpartners.com/renderBanner.do?zoneId=1742008" },
            { name: "Bet365", color: "#127e5d", offer: "Deposit Match up to 900$", url: "https://www.bet365.com/hub/en-us/open-account-offer-gaming?affiliate=365_03333889" },
            { name: "WSOP", color: "#7b1113", offer: "Deposit Match up to 800$", url: "https://wlcaesarsinteractive.adsrv.eacdn.com/C.ashx?btag=a_987658961b_2058c_&affid=2536&siteid=987658961&adid=2058&c=" },
            { name: "FanDuel", color: "#1475e1", offer: "Deposit Match up to 2000$", url: "https://wlfanduelus.adsrv.eacdn.com/C.ashx?btag=a_21532b_50c_&affid=11877&siteid=21532&adid=50&c=" },
            { name: "Playstar", color: "#2d1b4d", offer: "Deposit Match up to 500$", url: "https://click.trackplaystar.com/track/62436506-a2d2-4275-8d69-441854d193ca?type=seo&s1=freebets" },
            { name: "HardRock", color: "#000000", offer: "Deposit Match up to 600$", url: "https://wlhardrock.adsrv.eacdn.com/C.ashx?btag=a_1832b_258c_&affid=201&siteid=1832&adid=258&c=" },
            { name: "Fanatics", color: "#c8102e", offer: "Deposit Match up to 700$", url: "https://track.fanaticsbettingpartners.com/track/6c270394-cbf7-4c98-a6f2-10334c1afd85?type=native&s1=BonusBets" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const size = brands.length;
        const arc = Math.PI / (size / 2);
        let startAngle = 0;
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        function drawWheel() {
            ctx.clearRect(0, 0, 400, 400);
            for (let i = 0; i < size; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = brands[i].color;
                ctx.beginPath();
                ctx.arc(200, 200, 190, angle, angle + arc, false);
                ctx.lineTo(200, 200);
                ctx.fill();
                ctx.strokeStyle = "#d4af37";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "white";
                ctx.translate(200 + Math.cos(angle + arc / 2) * 130, 200 + Math.sin(angle + arc / 2) * 130);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.font = 'bold 12px Arial';
                ctx.fillText(brands[i].name, -ctx.measureText(brands[i].name).width / 2, 0);
                ctx.restore();
            }
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - degrees % 360) / arcd);
            const winner = brands[index];
            
            showModal(winner);
        }

        function showModal(winner) {
            document.getElementById("winner-name").innerText = winner.name;
            document.getElementById("winner-offer").innerText = winner.offer;
            document.getElementById("winner-link").href = winner.url;
            document.getElementById("modal").style.display = "flex";
        }

        function spin() {
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        drawWheel();
    </script>
</body>
</html>
