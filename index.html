<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin & Win Casino Offers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: hsl(220, 20%, 8%);
      --foreground: hsl(45, 100%, 95%);
      --primary: hsl(45, 100%, 50%);
      --secondary: hsl(220, 15%, 18%);
      --muted: hsl(220, 10%, 60%);
      --gold-gradient: linear-gradient(135deg, hsl(45, 100%, 50%) 0%, hsl(30, 100%, 45%) 50%, hsl(45, 100%, 55%) 100%);
      --dark-gradient: linear-gradient(180deg, hsl(220, 20%, 12%) 0%, hsl(220, 20%, 6%) 100%);
      --glass-bg: hsla(220, 15%, 15%, 0.8);
      --glow-gold: 0 0 30px hsla(45, 100%, 50%, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark-gradient);
      color: var(--foreground);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* --- EFEITO SPARKLING TURBO --- */
    #sparkles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .sparkle {
      position: absolute;
      background: radial-gradient(circle, #fff 0%, rgba(255,215,0,1) 40%, rgba(255,165,0,0) 80%);
      border-radius: 50%;
      opacity: 0;
      filter: blur(1px);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      animation: sparkle-anim linear forwards;
    }

    @keyframes sparkle-anim {
      0% { transform: translateY(0) scale(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }
    /* ------------------------ */

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .gold-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.3));
    }

    .timer-container { margin-bottom: 20px; }
    .timer-label { font-size: 14px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .timer { display: flex; justify-content: center; gap: 8px; align-items: center; }
    .timer-digit {
      background: linear-gradient(180deg, hsl(220, 15%, 18%) 0%, hsl(220, 15%, 12%) 100%);
      border: 1px solid hsla(45, 100%, 50%, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .timer-digit span { font-size: 24px; font-weight: 700; }
    .timer-separator { font-size: 24px; font-weight: 700; }

    .title { font-size: 42px; font-weight: 900; margin-bottom: 10px; line-height: 1.1; }
    .subtitle { font-size: 16px; color: var(--muted); margin-bottom: 30px; }

    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 30px;
    }

    @media (min-width: 768px) {
      .wheel-container { width: 420px; height: 420px; }
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid hsl(45, 100%, 50%);
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
      z-index: 20;
    }

    .wheel-border {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ffd700, #b8860b, #ffd700);
      padding: 8px;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    .wheel-border-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--background); }

    .wheel {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    }

    .wheel svg { width: 100%; height: 100%; }

    .center-circle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80px; height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.8);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: #000;
      z-index: 10;
      border: 3px solid #000;
    }

    .spin-button {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 800;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 20px 50px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 0px rgba(255, 215, 0, 0);
    }

    .spin-button:hover {
      transform: scale(1.1) translateY(-3px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 40px hsla(45, 100%, 50%, 0.8);
    }

    .spin-button:active { transform: scale(0.95); }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: linear-gradient(145deg, #1e2430, #0f1218);
      border: 2px solid #ffd700;
      border-radius: 24px;
      max-width: 500px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      padding: 40px 30px; position: relative;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
      animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-close {
      position: absolute; top: 15px; right: 15px;
      width: 40px; height: 40px;
      border-radius: 50%; background: #2a313e;
      border: 1px solid #ffd700; color: #ffd700;
      cursor: pointer; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }

    .winner-badge {
      display: inline-block; padding: 8px 20px;
      border-radius: 50px; font-size: 14px; font-weight: 800;
      background: #ffd700; color: #000;
      margin-bottom: 25px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .brand-logo-container {
      width: 240px; height: 120px;
      background: #fff; border-radius: 16px; padding: 15px;
      margin: 0 auto 25px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .brand-logo-container img { width: 100%; height: 100%; object-fit: contain; }

    .offer-box {
      background: rgba(255, 215, 0, 0.1);
      border: 2px dashed #ffd700;
      border-radius: 16px; padding: 20px;
      margin-bottom: 25px;
    }

    .offer-text { font-size: 28px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

    .cta-button {
      display: block; width: 100%;
      background: var(--gold-gradient);
      color: #000; font-weight: 900; font-size: 18px;
      text-transform: uppercase; padding: 20px;
      border: none; border-radius: 15px;
      cursor: pointer; text-decoration: none;
      text-align: center; transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .footer { margin-top: 40px; font-size: 11px; color: var(--muted); opacity: 0.7; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px hsla(45, 100%, 50%, 0.5); filter: brightness(1); }
      50% { box-shadow: 0 0 60px hsla(45, 100%, 50%, 0.9); filter: brightness(1.3); }
    }
  </style>
</head>
<body>
  <div id="sparkles-container"></div>

  <div class="container">
    <div class="timer-container">
      <p class="timer-label">✨ Limited Time Offer ✨</p>
      <div class="timer">
        <div class="timer-digit"><span class="gold-text" id="hours">02</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="minutes">12</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="seconds">45</span></div>
      </div>
    </div>

    <h1 class="title gold-text">JACKPOT CHANCE!</h1>
    <p class="subtitle">Spin the wheel to unlock your VIP welcome bonus</p>

    <div class="wheel-container">
      <div class="pointer"></div>
      <div class="wheel-border">
        <div class="wheel-border-inner"></div>
      </div>
      <div class="wheel" id="wheel">
        <svg viewBox="0 0 100 100"></svg>
      </div>
      <div class="center-circle">SPIN</div>
    </div>

    <button class="spin-button" id="spinBtn">SPIN TO WIN</button>
    <p class="footer">21+. Terms apply. Play responsibly.</p>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div style="text-align: center;">
        <span class="winner-badge">JACKPOT WON!</span>
        <div class="brand-logo-container">
          <img id="modalLogo" src="" alt="Brand Logo">
        </div>
        <div class="offer-box">
          <p class="offer-label" style="color: #ffd700; text-transform: uppercase; font-size: 12px; font-weight: 700;">Your Exclusive Reward</p>
          <p class="offer-text" id="modalOffer"></p>
        </div>
      </div>
      <a class="cta-button" id="modalCta" href="#" target="_blank">CLAIM NOW →</a>
      <div class="terms">
        <p id="modalTerms" style="font-size: 10px; color: #888; margin-top: 15px; text-align: center;"></p>
      </div>
    </div>
  </div>

  <script>
    // --- LÓGICA DO SPARKLING INTENSIFICADA ---
    function createSparkle() {
      const container = document.getElementById('sparkles-container');
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      
      const isGold = Math.random() > 0.3;
      const size = Math.random() * 6 + 2 + 'px';
      
      sparkle.style.width = size;
      sparkle.style.height = size;
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.top = Math.random() * 100 + '%';
      
      if(!isGold) {
          sparkle.style.background = 'radial-gradient(circle, #fff 0%, rgba(255,255,255,0.8) 50%, transparent 100%)';
          sparkle.style.boxShadow = '0 0 15px #fff';
      }
      
      const duration = Math.random() * 1.5 + 0.8;
      sparkle.style.animationDuration = duration + 's';
      
      container.appendChild(sparkle);
      
      setTimeout(() => {
        sparkle.remove();
      }, duration * 1000);
    }
    
    // Intervalo muito mais rápido (50ms em vez de 200ms)
    setInterval(createSparkle, 50);
    // -------------------------------------

    const brands = [
      { id: "caesar", name: "Caesars", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Caesars-removebg-preview.png", offer: "Deposit $10 earn $200", url: "#", color: "#F5F5F5", terms: "New users only. 21+. T&Cs apply." },
      { id: "betmgm", name: "BetMGM", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/BetMGM-removebg-preview.png", offer: "Match up to $1000", url: "#", color: "#E5D1B1", terms: "21+. New customers only. 1x playthrough." },
      { id: "bet365", name: "Bet365", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/bet365-2-removebg-preview.png", offer: "Match up to $900", url: "#", color: "#F5F5F5", terms: "Min deposit $10. Bet Credits available." },
      { id: "fanduel", name: "FanDuel", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/FanDuel-scaled.png", offer: "Match up to $2000", url: "#", color: "#E5D1B1", terms: "21+. New users only. Terms at FanDuel.com." }
    ];

    // Build Wheel
    const wheelSvg = document.querySelector('#wheel svg');
    const segmentAngle = 360 / brands.length;

    brands.forEach((brand, index) => {
      const startAngle = index * segmentAngle - 90;
      const endAngle = startAngle + segmentAngle;
      const startRad = (startAngle * Math.PI) / 180;
      const endRad = (endAngle * Math.PI) / 180;
      const x1 = 50 + 50 * Math.cos(startRad);
      const y1 = 50 + 50 * Math.sin(startRad);
      const x2 = 50 + 50 * Math.cos(endRad);
      const y2 = 50 + 50 * Math.sin(endRad);
      const largeArc = segmentAngle > 180 ? 1 : 0;
      const path = `M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArc} 1 ${x2} ${y2} Z`;
      const midAngle = ((startAngle + endAngle) / 2 * Math.PI) / 180;
      const logoX = 50 + 32 * Math.cos(midAngle);
      const logoY = 50 + 32 * Math.sin(midAngle);
      const logoRotation = (startAngle + endAngle) / 2 + 90;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = `
        <path d="${path}" fill="${index % 2 === 0 ? '#1a1a1a' : '#2a2a2a'}" stroke="#ffd700" stroke-width="0.5"/>
        <image href="${brand.logo}" x="${logoX - 10}" y="${logoY - 6}" width="20" height="12" transform="rotate(${logoRotation}, ${logoX}, ${logoY})" preserveAspectRatio="xMidYMid meet"/>
      `;
      wheelSvg.appendChild(g);
    });

    // Spin Logic
    let currentRotation = 0;
    let isSpinning = false;
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');

    spinBtn.addEventListener('click', () => {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.style.opacity = "0.7";

      const winnerIndex = Math.floor(Math.random() * brands.length);
      const rotations = 8 + Math.floor(Math.random() * 5); 
      const targetAngle = (winnerIndex * segmentAngle);
      const stopAngle = 360 - targetAngle - (segmentAngle / 2);
      
      currentRotation += (rotations * 360) + stopAngle - (currentRotation % 360);
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.style.opacity = "1";
        showModal(brands[winnerIndex]);
      }, 5000);
    });

    function showModal(brand) {
      document.getElementById('modalLogo').src = brand.logo;
      document.getElementById('modalOffer').textContent = brand.offer;
      document.getElementById('modalCta').href = brand.url;
      document.getElementById('modalTerms').textContent = brand.terms;
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.getElementById('modalClose').addEventListener('click', closeModal);

    // Timer Simple
    let totalSeconds = 7965;
    setInterval(() => {
      totalSeconds--;
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }, 1000);
  </script>
</body>
</html>
