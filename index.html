<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin & Win Casino Offers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: hsl(220, 20%, 8%);
      --foreground: hsl(45, 100%, 95%);
      --primary: hsl(45, 100%, 50%);
      --secondary: hsl(220, 15%, 18%);
      --muted: hsl(220, 10%, 60%);
      --gold-gradient: linear-gradient(135deg, hsl(45, 100%, 50%) 0%, hsl(30, 100%, 45%) 50%, hsl(45, 100%, 55%) 100%);
      --dark-gradient: linear-gradient(180deg, hsl(220, 20%, 12%) 0%, hsl(220, 20%, 6%) 100%);
      --glass-bg: hsla(220, 15%, 15%, 0.8);
      --glow-gold: 0 0 30px hsla(45, 100%, 50%, 0.4);
      
      /* Novas cores da roleta para máximo contraste */
      --wheel-color-1: #151921; /* Dark Navy */
      --wheel-color-2: #1e2430; /* Medium Navy */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark-gradient);
      color: var(--foreground);
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .gold-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .timer-container { margin-bottom: 20px; }
    .timer-label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .timer { display: flex; justify-content: center; gap: 8px; align-items: center; }
    .timer-digit {
      background: linear-gradient(180deg, hsl(220, 15%, 18%) 0%, hsl(220, 15%, 12%) 100%);
      border: 1px solid hsla(45, 100%, 50%, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 50px;
    }
    .timer-digit span { font-size: 24px; font-weight: 700; }
    .timer-separator { font-size: 24px; font-weight: 700; }

    .title { font-size: 36px; font-weight: 900; margin-bottom: 10px; }
    .subtitle { font-size: 16px; color: var(--muted); margin-bottom: 30px; }

    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto 30px;
    }

    @media (min-width: 768px) {
      .wheel-container { width: 400px; height: 400px; }
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 35px solid hsl(45, 100%, 50%);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
      z-index: 25;
    }

    .wheel-border {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--gold-gradient);
      padding: 8px;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }

    .wheel-border-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--background); }

    .wheel {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
    }

    .wheel svg { width: 100%; height: 100%; }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--gold-gradient);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: #111;
      z-index: 10;
      border: 3px solid #111;
    }

    .spin-button {
      background: var(--gold-gradient);
      color: #111;
      font-weight: 800;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 18px 45px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .spin-button:hover:not(:disabled) {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 15px 30px hsla(45, 100%, 50%, 0.4);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #1a1f29;
      border: 1px solid #d4af37;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      padding: 30px;
      position: relative;
    }

    .brand-logo-container {
      width: 180px;
      height: 90px;
      background: white; /* Fundo branco no modal para o logo brilhar */
      border-radius: 10px;
      padding: 10px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-container img { width: 100%; height: 100%; object-fit: contain; }

    .cta-button {
      display: block;
      width: 100%;
      background: var(--gold-gradient);
      color: #111;
      font-weight: 700;
      padding: 16px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 20px;
    }
    
    .pros-cons li { text-align: left; color: #ccc; font-size: 13px; margin-bottom: 5px; }

  </style>
</head>
<body>

  <div class="container">
    <div class="timer-container">
      <p class="timer-label">✨ OFFER EXPIRES IN ✨</p>
      <div class="timer">
        <div class="timer-digit"><span class="gold-text" id="hours">02</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="minutes">12</span></div>
        <span class="timer-separator gold-text">:</span>
        <div class="timer-digit"><span class="gold-text" id="seconds">45</span></div>
      </div>
    </div>

    <h1 class="title gold-text">🏆 SPIN & WIN! 🏆</h1>
    <p class="subtitle">Win exclusive bonuses at the top-rated sportsbooks!</p>

    <div class="wheel-container">
      <div class="pointer"></div>
      <div class="wheel-border">
        <div class="wheel-border-inner"></div>
      </div>
      <div class="wheel" id="wheel">
        <svg viewBox="0 0 100 100"></svg>
      </div>
      <div class="center-circle">LUCKY SPIN</div>
    </div>

    <button class="spin-button" id="spinBtn">SPIN TO REVEAL</button>
    <p class="footer" style="margin-top:20px; font-size: 11px; opacity: 0.6;">21+. Gamble responsibly. T&Cs apply.</p>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="gold-text" style="margin-bottom: 20px;">CONGRATULATIONS!</h2>
      <div class="brand-logo-container">
        <img id="modalLogo" src="" alt="">
      </div>
      <h3 id="modalName" style="color: white; margin-bottom: 10px;"></h3>
      <div style="background: rgba(212,175,55,0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3);">
         <p id="modalOffer" style="font-size: 20px; font-weight: 800; color: #d4af37;"></p>
      </div>
      <a class="cta-button" id="modalCta" href="#" target="_blank">CLAIM MY BONUS</a>
      <button id="modalClose" style="background:none; border:none; color:white; margin-top:15px; cursor:pointer; opacity:0.5;">Close</button>
    </div>
  </div>

  <script>
    const brands = [
      { name: "Caesars", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Caesars-removebg-preview.png", offer: "Deposit $10 earn $200", url: "#" },
      { name: "BetMGM", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/BetMGM-removebg-preview.png", offer: "Deposit Match up to $1000", url: "#" },
      { name: "Bet365", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/bet365-2-removebg-preview.png", offer: "Deposit Match up to $900", url: "#" },
      { name: "WSOP", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/WSOP.png", offer: "Deposit Match up to $800", url: "#" },
      { name: "Fanatics", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Fanatics-removebg-preview.png", offer: "Deposit Match up to $700", url: "#" },
      { name: "Hard Rock", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/Hard-Rock-Bet.png", offer: "Deposit Match up to $600", url: "#" },
      { name: "PlayStar", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/PlayStar.png", offer: "Deposit Match up to $500", url: "#" },
      { name: "FanDuel", logo: "https://offers.pickswise.com/wp-content/uploads/2026/01/FanDuel-scaled.png", offer: "Deposit Match up to $2000", url: "#" }
    ];

    const wheelSvg = document.querySelector('#wheel svg');
    const segmentAngle = 360 / brands.length;

    brands.forEach((brand, index) => {
      const startAngle = index * segmentAngle - 90;
      const endAngle = startAngle + segmentAngle;
      const startRad = (startAngle * Math.PI) / 180;
      const endRad = (endAngle * Math.PI) / 180;
      const x1 = 50 + 50 * Math.cos(startRad);
      const y1 = 50 + 50 * Math.sin(startRad);
      const x2 = 50 + 50 * Math.cos(endRad);
      const y2 = 50 + 50 * Math.sin(endRad);
      const largeArc = segmentAngle > 180 ? 1 : 0;
      
      // Cores alternadas baseadas nas variáveis :root
      const fillColor = (index % 2 === 0) ? 'var(--wheel-color-1)' : 'var(--wheel-color-2)';
      
      const midAngle = ((startAngle + endAngle) / 2 * Math.PI) / 180;
      const logoX = 50 + 32 * Math.cos(midAngle);
      const logoY = 50 + 32 * Math.sin(midAngle);
      const logoRotation = (startAngle + endAngle) / 2 + 90;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = `
        <path d="M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${fillColor}" stroke="#d4af37" stroke-width="0.1"/>
        <image href="${brand.logo}" x="${logoX - 10}" y="${logoY - 6}" width="20" height="12" 
          transform="rotate(${logoRotation}, ${logoX}, ${logoY})" 
          style="filter: drop-shadow(0px 0px 2px white) brightness(1.1);"
          preserveAspectRatio="xMidYMid meet"/>
      `;
      wheelSvg.appendChild(g);
    });

    // Lógica do Spin
    let currentRotation = 0;
    let isSpinning = false;
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');

    spinBtn.addEventListener('click', () => {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;

      const winnerIndex = Math.floor(Math.random() * brands.length);
      const extraVoltas = 2880; // 8 voltas
      const targetAngle = (winnerIndex * segmentAngle);
      const stopAngle = 360 - targetAngle - (segmentAngle / 2);
      
      currentRotation += extraVoltas + stopAngle + (360 - (currentRotation % 360));
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        showModal(brands[winnerIndex]);
      }, 5000);
    });

    function showModal(brand) {
      document.getElementById('modalLogo').src = brand.logo;
      document.getElementById('modalName').textContent = brand.name;
      document.getElementById('modalOffer').textContent = brand.offer;
      document.getElementById('modalCta').href = brand.url;
      document.getElementById('modalOverlay').classList.add('active');
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('active');
    });

    // Timer simples
    let time = 8000;
    setInterval(() => {
      time--;
      let m = Math.floor(time/60);
      let s = time%60;
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }, 1000);
  </script>
</body>
</html>
